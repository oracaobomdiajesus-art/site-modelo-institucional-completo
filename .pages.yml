media:
  input: "static/img"
  output: "/img"

content:
  - name: "central-acessos"
    label: "🔗 Central de Acessos"
    type: "file"
    path: "content/central-acessos.md"
    format: "yaml-frontmatter"
    fields:
      - name: "body"
        label: "Links das plataformas deste cliente"
        description: "Cole aqui o link de cada plataforma na frente do nome. Pode apagar o que não usar e acrescentar outras."
        type: "text"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "never"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "never"
            hidden: true

  - name: "profile"
    label: "Perfil e Seções"
    type: "file"
    path: "content/_index.md"
    format: "yaml-frontmatter"
    fields:
      - name: "title"
        label: "Nome do negócio"
        type: "string"
        required: true
      - name: "logo"
        label: "Logo"
        type: "image"
      - name: "telefone"
        label: "Telefone (exibido no site)"
        type: "string"
      - name: "whatsapp_url"
        label: "URL do WhatsApp"
        description: "Ex: https://wa.me/55SEUNUMERO"
        type: "string"
      - name: "instagram_url"
        label: "URL do Instagram"
        description: "Opcional"
        type: "string"
      - name: "endereco"
        label: "Endereço completo"
        description: "Usado no mapa e no botão 'Como Chegar'"
        type: "string"
      - name: "tema_cor"
        label: "Tema de cor do site"
        type: "select"
        default: "marrom"
        options:
          values:
            - value: "marrom"
              label: "Marrom/Bege (padrão)"
            - value: "verde"
              label: "Verde"
            - value: "rosa"
              label: "Rosa"
            - value: "azul"
              label: "Azul"
      - name: "cor_primaria"
        label: "Cor primária personalizada"
        description: "Opcional. Preencha esta E a de baixo (em hexadecimal, ex: #2E7D32) para usar uma cor sua em vez de um dos temas prontos acima"
        type: "string"
      - name: "cor_secundaria"
        label: "Cor secundária personalizada"
        description: "Opcional, usada em fundos e detalhes claros. Ex: #C8E6C9"
        type: "string"
      - name: "fundo_ativo"
        label: "Usar imagem de fundo no site"
        type: "boolean"
        default: false
      - name: "fundo_foto"
        label: "Foto de fundo"
        description: "Só aparece se a opção acima estiver ligada"
        type: "image"
      - name: "fundo_opacidade"
        label: "Opacidade da camada sobre a imagem de fundo"
        description: "De 0 (foto bem viva) a 100 (foto quase escondida). Sugestão: entre 30 e 55."
        type: "number"
        default: 40

      - name: "hero_selo"
        label: "[Topo] Selo/etiqueta pequena"
        description: "Ex: Amor em Cada Detalhe"
        type: "string"
      - name: "hero_titulo"
        label: "[Topo] Título — parte normal"
        type: "string"
      - name: "hero_destaque"
        label: "[Topo] Título — parte destacada (caixa colorida)"
        type: "string"
      - name: "hero_descricao"
        label: "[Topo] Descrição curta"
        type: "text"
      - name: "hero_botao1_texto"
        label: "[Topo] Texto do botão 1 (WhatsApp)"
        type: "string"
      - name: "hero_botao2_texto"
        label: "[Topo] Texto do botão 2 (leva para Serviços)"
        type: "string"
      - name: "hero_imagem"
        label: "[Topo] Foto de destaque"
        type: "image"

      - name: "sobre_titulo"
        label: "[Quem Somos] Título"
        type: "string"
      - name: "sobre_texto"
        label: "[Quem Somos] Texto"
        type: "text"
      - name: "sobre_foto1"
        label: "[Quem Somos] Foto principal"
        type: "image"
      - name: "sobre_foto2"
        label: "[Quem Somos] Foto pequena (sobreposta)"
        type: "image"

      - name: "servicos_titulo"
        label: "[Serviços] Título da seção"
        type: "string"
      - name: "servicos_subtitulo"
        label: "[Serviços] Subtítulo"
        type: "string"

      - name: "cardapio_ativo"
        label: "[Tabela de Preços] Mostrar tabela de preços?"
        description: "Lista de itens com preço, organizada por categoria (tipo cardápio de restaurante ou tabela de preços de salão/clínica)"
        type: "boolean"
        default: false
      - name: "cardapio_titulo"
        label: "[Tabela de Preços] Título da seção"
        type: "string"
      - name: "cardapio_subtitulo"
        label: "[Tabela de Preços] Subtítulo"
        type: "string"

      - name: "produtos_ativo"
        label: "[Produtos] Mostrar seção de produtos/categorias?"
        description: "Vitrine simples com foto e botão de WhatsApp por item — não é um catálogo com carrinho"
        type: "boolean"
        default: false
      - name: "produtos_titulo"
        label: "[Produtos] Título da seção"
        type: "string"
      - name: "produtos_subtitulo"
        label: "[Produtos] Subtítulo"
        type: "string"

      - name: "aviso_ativo"
        label: "[Aviso] Mostrar faixa de aviso rolante?"
        type: "boolean"
        default: false
      - name: "aviso_texto"
        label: "[Aviso] Texto do aviso"
        type: "string"

      - name: "blog_ativo"
        label: "[Blog] Mostrar Blog/Notícias?"
        description: "Só aparece no menu e na home se tiver pelo menos um post publicado"
        type: "boolean"
        default: false
      - name: "blog_titulo"
        label: "[Blog] Nome da seção"
        description: "Ex: Blog, Notícias, Novidades, Dicas"
        type: "string"
        default: "Blog"

      - name: "parceiros_ativo"
        label: "[Parceiros] Mostrar seção Nossos Parceiros?"
        description: "Lista de negócios parceiros com link pro site/Perfil da Empresa no Google deles. Ajuda no ranqueamento local — de vocês e deles — quando é uma citação real e recíproca."
        type: "boolean"
        default: false
      - name: "parceiros_titulo"
        label: "[Parceiros] Título da seção"
        type: "string"
        default: "Nossos Parceiros"
      - name: "parceiros_subtitulo"
        label: "[Parceiros] Subtítulo"
        type: "string"

  - name: "selos"
    label: "Selos de Credibilidade (Quem Somos)"
    type: "collection"
    path: "content/selos"
    format: "yaml-frontmatter"
    view:
      primary: "texto"
      fields: [texto, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "icone"
        label: "Ícone"
        description: "Classe Font Awesome. Ex: fa-solid fa-heart"
        type: "string"
      - name: "texto"
        label: "Texto do selo"
        description: "Curto, ex: Atendimento Humano"
        type: "string"
        required: true
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "servicos"
    label: "Serviços"
    type: "collection"
    path: "content/servicos"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "icone"
        label: "Ícone"
        description: "Classe Font Awesome. Ex: fa-solid fa-star"
        type: "string"
      - name: "title"
        label: "Nome do serviço"
        type: "string"
        required: true
      - name: "descricao"
        label: "Descrição curta"
        type: "text"
      - name: "botao_texto"
        label: "Texto do botão"
        description: "Opcional"
        type: "string"
      - name: "botao_url"
        label: "Link do botão"
        description: "Opcional, ex: link do WhatsApp"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "parceiros"
    label: "Parceiros"
    type: "collection"
    path: "content/parceiros"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "title"
        label: "Nome do parceiro"
        type: "string"
        required: true
      - name: "logo"
        label: "Logo do parceiro"
        type: "image"
      - name: "url"
        label: "Site ou Perfil da Empresa no Google do parceiro"
        description: "Use o site oficial do parceiro ou, se ele não tiver site, o link do Perfil da Empresa no Google dele. É esse link que conta como citação/indicação local pros dois negócios."
        type: "string"
        required: true
      - name: "descricao"
        label: "Como vocês se relacionam"
        description: "Frase curta e real, ex: Clínica parceira para exames complementares"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "cardapio"
    label: "Tabela de Preços"
    type: "collection"
    path: "content/cardapio"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, categoria, preco, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "title"
        label: "Nome do item/serviço"
        type: "string"
        required: true
      - name: "preco"
        label: "Preço"
        description: "Em reais, ex: 120.00"
        type: "number"
        required: true
      - name: "em_promocao"
        label: "Item em promoção?"
        type: "boolean"
        default: false
      - name: "preco_promocional"
        label: "Preço promocional"
        description: "Em reais, ex: 90.00 — só vale se 'Item em promoção' estiver ligado"
        type: "number"
      - name: "categoria"
        label: "Categoria"
        description: "Texto livre para agrupar os itens, ex: Consultas, Terapias Complementares"
        type: "string"
        required: true
      - name: "descricao"
        label: "Observação"
        description: "Opcional"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "vitrine"
    label: "Produtos / Categorias (Vitrine)"
    type: "collection"
    path: "content/vitrine"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "foto"
        label: "Foto"
        type: "image"
      - name: "title"
        label: "Nome"
        type: "string"
        required: true
      - name: "descricao"
        label: "Descrição curta"
        type: "text"
      - name: "preco"
        label: "Preço"
        description: "Opcional — deixe em branco se preferir que o cliente combine o valor pelo WhatsApp"
        type: "number"
      - name: "em_promocao"
        label: "Item em promoção?"
        description: "Só vale se 'Preço' estiver preenchido"
        type: "boolean"
        default: false
      - name: "preco_promocional"
        label: "Preço promocional"
        description: "Em reais — só vale se 'Item em promoção' estiver ligado"
        type: "number"
      - name: "estoque"
        label: "Estoque real"
        description: "Apenas informativo"
        type: "number"
      - name: "estoque_site"
        label: "Estoque exibido no site"
        description: "Opcional — pode ser diferente do real, usado como estratégia de escassez. Deixe em branco se não quiser mostrar. 0 mostra 'Esgotado'"
        type: "number"
      - name: "botao_texto"
        label: "Texto do botão"
        default: "Ver no WhatsApp"
        type: "string"
      - name: "botao_url"
        label: "Link do botão"
        description: "Ex: link do WhatsApp"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "blog"
    label: "Blog / Notícias"
    type: "collection"
    path: "content/blog"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, date]
      default:
        sort: "date"
        order: "desc"
    fields:
      - name: "title"
        label: "Título do post"
        type: "string"
        required: true
      - name: "date"
        label: "Data de publicação"
        type: "date"
      - name: "capa"
        label: "Imagem de capa"
        type: "image"
      - name: "resumo"
        label: "Resumo curto"
        description: "Aparece na lista do blog"
        type: "text"
      - name: "body"
        label: "Conteúdo do post"
        type: "rich-text"
